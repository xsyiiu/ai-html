<!doctype html>
<html lang="zh-CN">

<style>
:root{
  --fs:26;
  --bg:#f6f6f4; --fg:#14171a; --dim:#5d6b7a; --line:#e2e2dd; --bar:#fbfbf9; --acc:#2f6f4f;
}
html[data-theme="dark"]{
  --bg:#111418; --fg:#e9edf1; --dim:#8ab4d8; --line:#252a31; --bar:#171b21; --acc:#7fd1a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--line);
  padding:8px 10px calc(6px + env(safe-area-inset-top)/3);padding-top:calc(8px + env(safe-area-inset-top))}
.l1{display:flex;gap:8px;align-items:center}
.l2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
select,button{font:inherit;font-size:16px;font-weight:500;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;min-height:48px;line-height:1.2}
button:active{background:var(--line)}
#sel{flex:1 1 auto;min-width:120px}
#btnDraw{background:var(--acc);color:#fff;border-color:transparent;font-weight:700;padding:11px 20px;font-size:17px}
.tiny{font-size:13px;color:var(--dim);padding:8px 10px}
#meta{font-size:12px;color:var(--dim);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
main{padding-bottom:60px}
.r{display:flex;align-items:flex-start;padding:13px 12px 13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.w{flex:1 1 auto;width:auto;min-width:0;font-size:calc(var(--fs)*1px);font-weight:650;letter-spacing:.2px;word-break:break-word}
.m{display:none;min-width:0;font-size:calc(var(--fs)*0.6px);line-height:1.45;color:var(--dim);
  padding-left:6vw;opacity:0;transition:opacity .12s ease;pointer-events:none}
.r.on .m{opacity:1}
.r.on .w{color:var(--acc)}
.mk{flex:0 0 auto;display:flex;flex-direction:row;gap:10px;margin-left:10px;align-items:center;align-self:center}
.mk button{width:84px;height:72px;min-height:72px;padding:0;font-size:38px;line-height:1;border-radius:14px;border:3px solid transparent;font-weight:700}
.mk button.no{color:#d14343;border-color:rgba(209,67,67,.55);background:rgba(209,67,67,.09)}
.mk button.yes{color:#2f8f5b;border-color:rgba(47,143,91,.55);background:rgba(47,143,91,.09)}
.mk button.on{color:#fff;border-color:transparent}
.mk button.no.on{background:#d14343}
.mk button.yes.on{background:#2f8f5b}
.r.bad{background:rgba(209,67,67,.07)}
.r.bad .w{color:#d14343}
.r.good{background:rgba(47,143,91,.06)}
.r.good .w{color:#2f8f5b}
body.big .r{flex-wrap:wrap;align-items:center}
body.big .w{width:auto;max-width:none}
.r.on{flex-wrap:wrap}
.r.on .m{display:block;flex:0 0 100%;order:9;padding-left:0;margin-top:8px}
.mk{gap:12px;margin-left:10px;align-self:center}
body.big .m{order:3;flex:0 0 100%;padding-left:0;margin-top:6px;line-height:1.35}
.empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px;line-height:1.9}
dialog{border:none;border-radius:14px;padding:0;background:var(--bar);color:var(--fg);max-width:92vw;width:420px}
dialog::backdrop{background:#0007}
.pad{padding:14px 16px}
.pad h3{margin:2px 0 12px;font-size:15px}
.pad .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pad button{flex:1;min-width:120px;padding:12px;font-size:15px}
.note{font-size:12px;color:var(--dim);line-height:1.7}
#manage{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-bottom:40px}
.mbar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bar)}
.mbar b{flex:1;font-size:15px}
.mact{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.mact button{flex:1;min-width:calc(50% - 6px);padding:12px;font-size:15px}
.mrow{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.mi{flex:1;min-width:0}
.mt{font-size:15px;font-weight:600}

.mrow button{padding:10px 14px;font-size:15px}
.mrow .md{color:#d14343;border-color:#d1434355}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#000c;color:#fff;
  padding:9px 15px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>

<body>
<header>
  <div class="l1">
    <select id="sel" title="选择日期/批次"></select>
    <select id="tgt" title="本次抽词量">
      <option value="25">25</option><option value="50">50</option>
      <option value="75" selected>75</option><option value="100">100</option>
      <option value="150">150</option>
    </select>
    <button id="btnDraw">抽词</button>
  </div>
  <div class="l2">
    <button id="btnInstall" hidden style="background:var(--acc);color:#fff;border-color:transparent;font-weight:700">安装</button>
    <button id="btnFsMinus" title="字号变小">A−</button>
    <button id="btnFsPlus" title="字号变大">A+</button>

<main id="list"></main>

  <div class="mbar"><b>抽词记录</b><button id="mngClose">关闭</button></div>
  <div class="mact">
    <button id="mngExport">导出全部</button>

</div>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="pad">
    <h3>数据</h3>
    <div class="row">
      <button id="btnExportCur">导出本组</button>
      <button id="btnExportAll">导出全部</button>
    </div>

      <button id="btnCopyAll">复制本组全部</button>
      <button id="btnCopyToday">复制今天错词</button>

      <button id="btnBackup">备份</button>

</dialog>

  <div class="pad">
    <h3>本次抽词规则</h3>
    <div class="note" id="ruleBody"></div>

      <button id="btnRuleClose" style="flex:1">关闭</button>
    </div>
  </div>
</dialog>
<input type="file" id="fileIn" accept=".json" hidden>

<script>
"use strict";
const APP_VER = "2.2";
const APP_BUILT = "2026-11-06";
const DATA_URL = "words.json";
const K_DATA = "ci.data", K_SETS = "ci.sets", K_PREFS = "ci.prefs", K_SEQ = "ci.seq", K_REV = "ci.rev";
const $ = id => document.getElementById(id);

/* ---------- 存储 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("存储失败：" + e.message); } },
  del(k) { localStorage.removeItem(k); }
};

let DATA = (store.get(K_DATA, null) || {}).payload || null;
let SETS = store.get(K_SETS, {});      // "2026-11-04|1" -> {date,n,target,words:[...]}
let PREFS = store.get(K_PREFS, { fs: 26, theme: "light" });
let curKey = null;                      // 当前查看的组
let REV = store.get(K_REV, {});          // 每个词的复习状态 {g:间隔天数, d:下次到期, s:连对, l:记错, n:复习次数}

/* ---------- 小工具 ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1600);
}
const pad2 = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const cn = s => { const a = s.split("-"); return (+a[1]) + "月" + (+a[2]) + "日"; };
const dayShift = (s, k) => { const a = s.split("-").map(Number); const d = new Date(a[0], a[1] - 1, a[2]); d.setDate(d.getDate() + k);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function lcg(seed) { let s = seed >>> 0; return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- 数据 ---------- */
async function loadData(force) {
  let ok = false;
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) {
      DATA = await r.json();
      store.set(K_DATA, { ts: Date.now(), payload: DATA });
      ok = true;
    }
  } catch (e) { /* 离线就用缓存 */ }
  if (!ok && DATA) toast("离线：用手机缓存里的词表");
  if (!ok && !DATA) { $("list").innerHTML = '<div class="empty">词表没加载到<br>连一次网再点「更新」</div>'; }
  renderMeta();
  return ok;
}

function renderMeta() {
  const m = $("meta");
  if (!DATA) { m.innerHTML = ""; return; }
  const n = DATA.count || DATA.words.length;
  const upd = DATA.updated ? cn(DATA.updated) : "—";
  const lb = (DATA.latest && DATA.latest.date) ? "错词批次 " + cn(DATA.latest.date) : "";
  const set = curKey && SETS[curKey] ? SETS[curKey] : null;
  let s = `<span>v${APP_VER}</span><span>词表 ${n} 词</span><span>到期 ${dueCount(todayStr())}</span><span>${lb}</span>`;
  if (set) {
    const on = document.querySelectorAll(".r.on").length;
    const bad = document.querySelectorAll(".r.bad").length;
    const good = document.querySelectorAll(".r.good").length;
    s += `<span>本组 ${set.words.length} 词 · 点开 ${on} · 错 ${bad} · 对 ${good}</span>`;
  }
  m.innerHTML = s;
}

/* ---------- 抽词算法 ---------- */
function cmpFreq(a, b) { // 考频降序，待补(-1)最后，同分按词名
  const fa = a.f < 0 ? -1 : a.f, fb = b.f < 0 ? -1 : b.f;
  if (fa !== fb) return fb - fa;
  return a.w < b.w ? -1 : a.w > b.w ? 1 : 0;
}
function cmpCnt(a, b) {
  if (a.c !== b.c) return b.c - a.c;
  return a.w < b.w ? -1 : a.w > b.w ? 1 : 0;
}

/* 间隔复习：REV[词] = {g 间隔天数, d 下次到期日期, s 连续记对次数, l 记错次数, n 复习次数} */
function addD(day, n) {
  const a = day.split("-").map(Number);
  const d = new Date(a[0], a[1] - 1, a[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function gap0(c) { return c >= 6 ? 2 : c === 5 ? 3 : c === 4 ? 5 : c === 3 ? 7 : c === 2 ? 10 : 14; }
function dayDiff(a, b) { return Math.round((Date.parse(a + "T00:00:00") - Date.parse(b + "T00:00:00")) / 86400000); }
let RECENT = new Map();      // 近 30 天该词又被上传／抽到的次数
function buildRecent(day) {
  RECENT = new Map();
  const from = addD(day, -30);
  const B = (DATA && DATA.batches) || {};
  Object.keys(B).forEach(d => {
    if (d >= from && d <= day) (B[d] || []).forEach(w => RECENT.set(w, (RECENT.get(w) || 0) + 1));
  });
}
/* 老账放宽、近期反复错的收紧 */
function gap0eff(o) {
  let g = gap0(o.c);
  const r = RECENT.get(o.w) || 0;
  if (r === 0) g = Math.min(14, g * 2);      // 近 30 天没再错，当它旧账，先拉开
  else if (r >= 2) g = Math.max(2, g - 1);   // 近 30 天还在错，收紧
  return g;
}
function isGrad(w) { const r = REV[w]; return !!r && (r.g || 0) >= 90; }
function isFuture(w, day) { const r = REV[w]; return !!r && r.d > day; }   // 已排好下次日期，还没到期
function dueCount(day) { return DATA ? DATA.words.filter(w => REV[w.w] && REV[w.w].d <= day && !isGrad(w.w)).length : 0; }
function gradCount() { return DATA ? DATA.words.filter(w => isGrad(w.w)).length : 0; }

/* 抽到时：默认按「模糊」处理，间隔不放大 */
function scheduleAfterDraw(w, day) {
  const o = DATA.words.find(x => x.w === w); if (!o) return;
  const r = REV[w] || { g: 0, s: 0, l: 0, n: 0 };
  if (!r.g) r.g = gap0eff(o);
  r.d = addD(day, Math.max(2, Math.round(r.g / 2)));
  r.n = (r.n || 0) + 1;
  REV[w] = r;
}
/* 标记：✓ 间隔放大；✗ 打回 2 天；再点取消 = 回到模糊 */
function applyMark(w, kind, day) {
  const o = DATA.words.find(x => x.w === w); if (!o) return;
  const r = REV[w] || { g: gap0eff(o), s: 0, l: 0, n: 1 };
  if (kind === 1) {
    r.s = (r.s || 0) + 1;
    r.g = Math.min(90, Math.round((r.g || gap0eff(o)) * 1.9));
    if (r.s >= 3 && o.c >= 5) r.g = 90;          // 错了五六遍还连对三次 → 熟知，90 天后再见
    r.d = addD(day, r.g);
  } else if (kind === -1) {
    r.s = 0; r.l = (r.l || 0) + 1; r.g = 2; r.d = addD(day, 2);
  } else {
    r.s = 0; r.g = r.g || gap0eff(o); r.d = addD(day, Math.max(2, Math.round(r.g / 2)));
  }
  REV[w] = r;
}

function buildPick(target, seedStr, dateStr, drawnToday) {
  const byW = new Map(); DATA.words.forEach(w => byW.set(w.w, w));
  const used = new Set(), out = [], tags = {};
  const drawn = new Set(drawnToday || []);
  let skip = true;
  const push = (w, tag) => {
    if (out.length >= target || used.has(w.w)) return false;
    if (skip && drawn.has(w.w)) return false;
    used.add(w.w); out.push(w.w); tags[w.w] = tag; return true;
  };
  const rnd = lcg(hash(seedStr));
  const take = (list, n, start, tag) => { let a = 0; const L = list.length; if (!L) return 0;
    for (let i = 0; i < L && a < n && out.length < target; i++) { if (push(list[(start + i) % L], tag)) a++; } return a; };
  const T = target;

  const pass1 = () => {
    // A 今日新错词：全量，考频降序
    const A = ((DATA.latest && DATA.latest.words) || []).map(w => byW.get(w)).filter(Boolean).sort(cmpFreq);
    A.forEach(w => push(w, "今"));

    // B 到期复习：到期日已到（含逾期），错得越多越靠前
    if (out.length < T) {
      const due = DATA.words.filter(w => REV[w.w] && REV[w.w].d <= dateStr && !isGrad(w.w))
        .sort((a, b) => (dayDiff(dateStr, REV[b.w].d) - dayDiff(dateStr, REV[a.w].d)) || (b.c - a.c) || cmpFreq(a, b));
      take(due, Math.round(T * 0.32), 0, "到期");
    }

    // C 形近连坐：今日错词所在族优先，最多 10 个
    if (out.length < T) {
      const prio = [...new Set(A.map(w => w.fam).filter(Boolean))];
      const all = [...new Set(DATA.words.filter(w => w.fam).map(w => w.fam))].sort();
      const order = prio.concat(all.filter(f => prio.indexOf(f) < 0));
      const famMap = new Map();
      DATA.words.forEach(w => { if (!w.fam) return; if (!famMap.has(w.fam)) famMap.set(w.fam, []); famMap.get(w.fam).push(w); });
      let got = 0;
      for (const f of order) {
        if (got >= 10 || out.length >= T) break;
        const mem = (famMap.get(f) || []).filter(x => !isGrad(x.w) && !isFuture(x.w, dateStr)).slice().sort(cmpCnt);
        if (!mem.length) continue;
        const st = Math.floor(rnd() * mem.length);
        let add = 0;
        for (let i = 0; i < mem.length && add < 2; i++) { if (push(mem[(st + i) % mem.length], "形近")) { add++; got++; } }
      }
    }

    // D 黑洞补漏：错≥3 考频≤2，4 个
    if (out.length < T) {
      const E = DATA.words.filter(w => w.c >= 3 && w.f >= 0 && w.f <= 2 && !isGrad(w.w) && !isFuture(w.w, dateStr)).sort(cmpCnt);
      take(E, 4, Math.floor(rnd() * E.length), "黑洞");
    }

    // E 高频核心：考频≥20，8 个
    if (out.length < T) {
      const C = DATA.words.filter(w => w.f >= 20 && !isGrad(w.w) && !isFuture(w.w, dateStr)).sort(cmpFreq);
      take(C, 8, Math.floor(rnd() * C.length), "高频");
    }

    // F 补位：按考频补足
    if (out.length < T) {
      const rest = DATA.words.filter(w => !isGrad(w.w) && !isFuture(w.w, dateStr)).sort(cmpFreq);
      take(rest, T - out.length, Math.floor(rnd() * Math.max(1, rest.length)), "补位");
    }
  };

  pass1();
  if (out.length < target) { skip = false; pass1(); }
  return { words: out, tags };
}

function draw() {
  if (!DATA) { toast("词表还没加载"); return; }
  const target = +$("tgt").value;
  const day = todayStr();
  const seq = store.get(K_SEQ, {});
  const n = (seq[day] || 0) + 1;
  const prev = Object.keys(SETS).filter(k => k.indexOf(day + "|") === 0).length;
  const nn = Math.max(n, prev + 1);
  const key = day + "|" + nn;
  const drawnToday = [];
  Object.values(SETS).forEach(s => { if (s.date === day) s.words.forEach(w => drawnToday.push(w)); });
  buildRecent(day);
  const res = buildPick(target, key + "#" + target, day, drawnToday);
  res.words.forEach(w => scheduleAfterDraw(w, day));
  store.set(K_REV, REV);
  SETS[key] = { date: day, n: nn, target, words: res.words, tags: res.tags, ts: Date.now() };
  seq[day] = nn; store.set(K_SEQ, seq); store.set(K_SETS, SETS);
  curKey = key;
  fillSel();
  render();
  toast("抽出 " + res.words.length + " 词 · " + cn(day) + " 第" + nn + "次");
}

function recoverTags(s, key) {
  try {
    const res = buildPick(s.target, key + "#" + s.target, s.date, []);
    if (res.words.length === s.words.length && res.words.every((w, i) => w === s.words[i])) {
      s.tags = res.tags; store.set(K_SETS, SETS); return true;
    }
  } catch (e) { }
  return false;
}

/* ---------- 渲染 ---------- */
function render() {
  const box = $("list");
  const set = curKey && SETS[curKey];
  if (!set) { box.innerHTML = '<div class="empty">选个日期，或者点「抽词」<br>抽出来的词会自动存在手机上</div>'; renderMeta(); return; }
  const byW = new Map(); ((DATA && DATA.words) || []).forEach(w => byW.set(w.w, w));
  const marks = set.marks || {};
  const html = set.words.map(w => {
    const o = byW.get(w);
    const mean = o ? ((o.p || "") + (o.d || "")) : "（词表里没有这个词）";
    const m = marks[w] || 0;
    const cls = "r" + (m === -1 ? " bad" : m === 1 ? " good" : "");
    return '<div class="' + cls + '" data-w="' + w + '">' +
      '<div class="w">' + w + '</div><div class="m">' + mean + '</div>' +
      '<div class="mk"><button class="no' + (m === -1 ? " on" : "") + '" data-k="-1">✗</button>' +
      '<button class="yes' + (m === 1 ? " on" : "") + '" data-k="1">✓</button></div></div>';
  }).join("");
  box.innerHTML = html || '<div class="empty">这组是空的</div>';
  box.querySelectorAll(".r").forEach(el => {
    el.addEventListener("click", () => { el.classList.toggle("on"); renderMeta(); });
    el.querySelectorAll(".mk button").forEach(b => {
      b.addEventListener("click", ev => {
        ev.stopPropagation();
        const w = el.dataset.w, k = +b.dataset.k;
        const st = curSet();
        st.marks = st.marks || {};
        const now = st.marks[w] === k ? 0 : k;
        if (now === 0) delete st.marks[w]; else st.marks[w] = now;
        store.set(K_SETS, SETS);
        applyMark(w, now, todayStr());
        store.set(K_REV, REV);
        el.classList.remove("bad", "good");
        el.querySelectorAll(".mk button").forEach(x => x.classList.remove("on"));
        if (now === -1) { el.classList.add("bad"); el.querySelector(".mk .no").classList.add("on"); }
        if (now === 1) { el.classList.add("good"); el.querySelector(".mk .yes").classList.add("on"); }
        renderMeta();
      });
    });
  });
  window.scrollTo({ top: 0 });
  renderMeta();
}

let lastSel = null;
function sortedKeys() {
  return Object.keys(SETS).sort((a, b) => {
    const A = SETS[a], B = SETS[b];
    if (A.date !== B.date) return A.date < B.date ? 1 : -1;
    return B.n - A.n;
  });
}
function fillSel() {
  const sel = $("sel"), keep = curKey;
  const keys = sortedKeys();
  if (!keys.length) { sel.innerHTML = '<option value="">（还没抽过）</option>'; curKey = null; lastSel = null; return; }
  const top = keys.slice(0, 10);
  sel.innerHTML = top.map(k => {
    const s = SETS[k];
    return '<option value="' + k + '">' + cn(s.date) + ' 第' + s.n + '次 · ' + s.words.length + '词</option>';
  }).join("") + (keys.length > 10 ? '<option value="__more">查看更多（共' + keys.length + '组）…</option>' : "");
  if (keep && SETS[keep]) sel.value = keep; else curKey = sel.value = keys[0];
  lastSel = curKey;
}

/* ---------- 管理页 ---------- */
function openManage() { $("manage").hidden = false; renderManage(); }
function closeManage() { $("manage").hidden = true; }
function renderManage() {
  const keys = sortedKeys();
  const size = (JSON.stringify(SETS).length / 1024).toFixed(1);
  $("mngInfo").innerHTML = "共 " + keys.length + " 组，占 " + size + " KB。<br>点「打开」切到那组，点「删除」删掉那一组。";
  const box = $("mngList");
  if (!keys.length) { box.innerHTML = '<div class="empty">还没有抽过的记录</div>'; return; }
  box.innerHTML = keys.map(k => {
    const s = SETS[k];
    const bad = badWords(s).length;
    const good = s.words.filter(w => (s.marks || {})[w] === 1).length;
    const cur = k === curKey ? " · 当前" : "";
    return '<div class="mrow" data-k="' + k + '">' +
      '<div class="mi"><div class="mt">' + cn(s.date) + " 第" + s.n + "次" + cur + "</div>" +
      '<div class="ms">' + s.words.length + "词 · 目标" + s.target + " · 错 " + bad + " · 对 " + good + "</div></div>" +
      '<button class="mo">打开</button><button class="md">删除</button></div>';
  }).join("");
  box.querySelectorAll(".mrow").forEach(el => {
    const k = el.dataset.k;
    el.querySelector(".mo").addEventListener("click", () => {
      curKey = lastSel = k; $("sel").value = k; render(); closeManage();
    });
    el.querySelector(".md").addEventListener("click", () => {
      const s = SETS[k];
      if (!confirm("删除 " + cn(s.date) + " 第" + s.n + "次（" + s.words.length + " 词）？删了就找不回来。")) return;
      delete SETS[k]; store.set(K_SETS, SETS);
      if (curKey === k) curKey = null;
      fillSel(); render(); renderManage(); toast("已删除 1 组");
    });
  });
}
$("mngClose").addEventListener("click", closeManage);

/* ---------- 导出/备份 ---------- */
function download(name, text, type) {
  const b = new Blob([text], { type: type || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("已复制 " + t.split("\n").length + " 个词"); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
      toast("已复制 " + t.split("\n").length + " 个词"); return true;
    } catch (e2) { toast("复制失败，长按手动选择"); return false; }
  }
}
function badWords(ofSet) {
  const s = ofSet, m = (s && s.marks) || {};
  return s.words.filter(w => m[w] === -1);
}
function setToText(s) {
  const byW = new Map(); ((DATA && DATA.words) || []).forEach(w => byW.set(w.w, w));
  return s.words.map(w => { const o = byW.get(w); return w + "\t" + (o ? (o.p || "") + (o.d || "") : ""); }).join("\n");
}
function curSet() { return curKey && SETS[curKey] ? SETS[curKey] : null; }

/* ---------- 事件 ---------- */
$("btnDraw").addEventListener("click", draw);
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installEvt = e;
  const b = $("btnInstall"); if (b) b.hidden = false;
});
window.addEventListener("appinstalled", () => { const b = $("btnInstall"); if (b) b.hidden = true; toast("已添加到桌面"); });
document.addEventListener("click", e => {
  if (e.target && e.target.id === "btnInstall") {
    if (!installEvt) { toast("浏览器菜单里选「添加到主屏幕」"); return; }
    installEvt.prompt(); installEvt.userChoice && installEvt.userChoice.then(() => { installEvt = null; $("btnInstall").hidden = true; });
  }
});
$("sel").addEventListener("change", e => {
  if (e.target.value === "__more") { e.target.value = lastSel || (sortedKeys()[0] || ""); openManage(); return; }
  curKey = lastSel = e.target.value; render();
});
$("btnAll").addEventListener("click", () => {
  const rows = document.querySelectorAll(".r");
  const allOn = rows.length && document.querySelectorAll(".r.on").length === rows.length;
  rows.forEach(r => r.classList.toggle("on", !allOn));
  renderMeta();
  toast(allOn ? "已全部遮住" : "已全部显示");
});
function fsStep() { return PREFS.fs >= 64 ? 8 : PREFS.fs >= 40 ? 4 : 2; }
$("btnFsPlus").addEventListener("click", () => { PREFS.fs = Math.min(128, PREFS.fs + fsStep()); applyPrefs(); store.set(K_PREFS, PREFS); });
$("btnFsMinus").addEventListener("click", () => { PREFS.fs = Math.max(16, PREFS.fs - fsStep()); applyPrefs(); store.set(K_PREFS, PREFS); });
$("btnTheme").addEventListener("click", () => { PREFS.theme = PREFS.theme === "dark" ? "light" : "dark"; applyPrefs(); store.set(K_PREFS, PREFS); });
$("btnUpd").addEventListener("click", async () => { toast("更新中…"); const ok = await loadData(true); if (ok) toast("词表已更新 · " + cn(DATA.updated)); });
$("btnBad").addEventListener("click", () => {
  const s = curSet();
  if (!s) { toast("先抽一次词"); return; }
  const bad = badWords(s);
  if (!bad.length) { toast("这组还没标错的词（点每行右边的 ✗）"); return; }
  copyText(bad.join("\n"));
});
$("btnRule").addEventListener("click", () => {
  const s = curSet();
  if (!s) { toast("先抽一次词"); return; }
  if (!s.tags) recoverTags(s, curKey);
  const order = ["今", "到期", "形近", "黑洞", "高频", "补位"];
  const name = {
    "今": "今日新错词（全量，考频降序）",
    "到期": "到期复习（按间隔到期，错多者优先）",
    "形近": "形近连坐（今日错词所在族优先，约 10 个）",
    "黑洞": "黑洞补漏（错≥3 且考频≤2，4 个）",
    "高频": "高频核心（考频≥20，轮转 8 个）",
    "补位": "补位（按考频补足）"
  };
  const cnt = {};
  (s.words || []).forEach(w => { const t = (s.tags || {})[w] || "—"; cnt[t] = (cnt[t] || 0) + 1; });
  let lines = order.filter(t => cnt[t]).map(t => "· " + name[t] + "　<b>" + cnt[t] + "</b> 词").join("<br>");
  if (cnt["—"]) lines += (s.tags ? "<br>· 其余　<b>" : "<br>· 这组是旧版本抽的，构成没记下来　<b>") + cnt["—"] + "</b> 词";
  const d0 = todayStr();
  $("ruleBody").innerHTML =
    "日期 " + cn(s.date) + "　第 " + s.n + " 次　目标 " + s.target + " 词　实抽 <b>" + s.words.length + "</b> 词<br><br>" +
    "<b>本次构成</b><br>" + lines + "<br><br>" +
    "<b>怎么挑的</b><br>" + [
      "1. 今日新错词：最近一次入账的错词全部进来，按考研考频从高到低——刚错的当天必须过。",
      "2. 到期复习：每个词都有自己的「下次到期日」，到期的才进来；按逾期天数排序，拖得最久的先补，最多占本次三成。",
      "3. 形近连坐：先抽今日错词所在词族里的其他成员，同族最多 2 个，上限 10 个。",
      "4. 黑洞补漏：错≥3 但考频≤2 的词，取 4 个。",
      "5. 高频核心：考频≥20 的词轮转 8 个。",
      "6. 补位：不够目标数量就按考频补；同一个词只出现一次。",
      "7. 同一天抽第 2、3 次时，当天已经抽过的词不会再出（词不够才允许重复）。"
    ].join("<br>") +
    "<br><br><b>间隔怎么算</b><br>" + [
      "· 第一次见面：按错误次数定间隔——错≥6 → 2 天，错5 → 3 天，错4 → 5 天，错3 → 7 天，错2 → 10 天，错1 → 14 天。",
      "· 老账修正：近 30 天没再错的词，首次间隔放大一倍（最多 14 天）；近 30 天还在错的，收紧 1 天。",
      "· 点 ✓（记得）：间隔 ×1.9，逐次拉长，最长 90 天。",
      "· 点 ✗（忘了）：间隔打回 2 天，明天再来。",
      "· 什么都不点：当「模糊」处理，间隔不放大，过约一半间隔再出现。",
      "· 错了 5 次以上、连对 3 次的词判为「熟知」，排到 90 天以后，不再天天占量。"
    ].join("<br>") +
    "<br><br><b>当前状态</b> 到期 " + dueCount(d0) + " 词 · 熟知 " + gradCount() + " 词 · 已记录复习 " + Object.keys(REV).length + " 词" +
    "<br><b>标记</b> 每行右边 ✗ 记错、✓ 记对，顶部「复制错词」一键复制本组错词" +
    "<br><b>版本</b> 网站 v" + APP_VER + "（" + cn(APP_BUILT) + "）<br><b>字号</b> " + PREFS.fs + "px　<b>词表</b> " +
    (DATA ? DATA.words.length + " 词，更新于 " + cn(DATA.updated) : "未加载");
  $("dlgRule").showModal();
});
$("btnRuleClose").addEventListener("click", () => $("dlgRule").close());
$("btnMore").addEventListener("click", () => {
  const s = curSet();
  const size = (JSON.stringify(SETS).length / 1024).toFixed(1);
  $("info").innerHTML =
    "网站版本 v" + APP_VER + "（" + cn(APP_BUILT) + " 构建）<br>" +
    "词表 " + (DATA ? DATA.words.length : 0) + " 词，更新于 " + (DATA && DATA.updated ? cn(DATA.updated) : "—") + "<br>" +
    "已存 " + Object.keys(SETS).length + " 组抽词（" + size + " KB）<br>" +
    "当前：" + (s ? cn(s.date) + " 第" + s.n + "次 · " + s.words.length + "词 · 目标" + s.target : "无") + "<br>" +
    "<br>备份会把所有抽过的组一起导出成 json；换手机时用「恢复」导入。";
  $("dlg").showModal();
});
$("btnClose").addEventListener("click", () => $("dlg").close());
$("btnExportCur").addEventListener("click", () => {
  const s = curSet(); if (!s) { toast("没有可导出的组"); return; }
  download(cn(s.date) + "抽词-第" + s.n + "次.txt", setToText(s));
  toast("已导出本组");
});
function doExportAll() {
  const keys = Object.keys(SETS).sort(); if (!keys.length) { toast("还没抽过词"); return; }
  download("抽词全部-" + todayStr() + ".txt", keys.map(k => {
    const s = SETS[k]; return "=== " + cn(s.date) + " 第" + s.n + "次（" + s.words.length + "词） ===\n" + setToText(s);
  }).join("\n\n"));
  toast("已导出全部");
}
$("btnExportAll").addEventListener("click", doExportAll);
$("mngExport").addEventListener("click", doExportAll);
$("btnCopyAll").addEventListener("click", () => {
  const s = curSet(); if (!s) { toast("没有可复制的组"); return; }
  copyText(s.words.join("\n"));
});
$("btnCopyToday").addEventListener("click", () => {
  const day = todayStr(), out = [];
  Object.values(SETS).forEach(s => { if (s.date === day) badWords(s).forEach(w => { if (out.indexOf(w) < 0) out.push(w); }); });
  if (!out.length) { toast("今天还没有标错的词"); return; }
  copyText(out.join("\n"));
});
function doBackup() {
  download("抽词备份-" + todayStr() + ".json", JSON.stringify({ v: 2, ts: Date.now(), prefs: PREFS, sets: SETS, rev: REV }, null, 1), "application/json");
  toast("已备份");
}
$("btnBackup").addEventListener("click", doBackup);
$("mngBackup").addEventListener("click", doBackup);
$("btnRestore").addEventListener("click", () => $("fileIn").click());
$("mngRestore").addEventListener("click", () => $("fileIn").click());
$("fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o.sets) throw new Error("不是备份文件");
      let n = 0;
      Object.keys(o.sets).forEach(k => { if (!SETS[k]) { SETS[k] = o.sets[k]; n++; } });
      store.set(K_SETS, SETS);
      if (o.rev) { Object.keys(o.rev).forEach(k => { if (!REV[k]) REV[k] = o.rev[k]; }); store.set(K_REV, REV); }
      if (o.prefs) { PREFS = Object.assign(PREFS, o.prefs); applyPrefs(); store.set(K_PREFS, PREFS); }
      fillSel(); render(); toast("恢复 " + n + " 组");
    } catch (err) { toast("恢复失败：" + err.message); }
    e.target.value = "";
  };
  rd.readAsText(f);
});
function doClear() {
  if (!confirm("清空手机上所有抽词记录和复习进度？词表缓存会保留。")) return;
  SETS = {}; REV = {}; store.set(K_SETS, {}); store.set(K_REV, {}); store.del(K_SEQ); curKey = null; fillSel(); render();
  if (!$("manage").hidden) renderManage();
  toast("已清空");
}
$("btnClear").addEventListener("click", doClear);
$("mngClear").addEventListener("click", doClear);

/* ---------- 启动 ---------- */
function applyPrefs() {
  document.documentElement.style.setProperty("--fs", PREFS.fs);
  document.documentElement.setAttribute("data-theme", PREFS.theme || "light");
  document.body.classList.toggle("big", PREFS.fs >= 60);
}
(async function init() {
  applyPrefs();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => { }); });
  }
  fillSel();
  render();
  await loadData(false);
  fillSel();
  render();
})();
</script>
</body>
</html>
