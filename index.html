<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">
<title>抽词复习</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="抽词">
<style>
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
:root{
  --fs:26;
  --bg:#f3f1ec; --card:#fffdf9; --fg:#1d2228; --dim:#7a8088; --mean:#3e4852; --line:#e4e0d8; --bar:#f3f1ecf2;
  --acc:#2c5d8a; --accsoft:rgba(44,93,138,.10);
  --bad:#c0463c; --badsoft:rgba(192,70,60,.10); --good:#2f7d5a; --goodsoft:rgba(47,125,90,.10);
  --shadow:0 1px 2px rgba(40,30,10,.05),0 2px 8px rgba(40,30,10,.04);
}
html[data-theme="dark"]{
  --bg:#12161c; --card:#1a1f27; --fg:#ece8e1; --dim:#8a939e; --mean:#bcc7d2; --line:#262c35; --bar:#12161cf2;
  --acc:#7fb0dc; --accsoft:rgba(127,176,220,.14);
  --bad:#e57368; --badsoft:rgba(229,115,104,.13); --good:#6cc49a; --goodsoft:rgba(108,196,154,.12);
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif}
body{min-height:100vh}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.l1{display:flex;gap:8px;align-items:center}
.l2{display:flex;gap:6px;align-items:center;margin-top:8px}
.l2 button{flex:1 1 0;min-width:0;padding:10px 4px;font-size:15px;background:var(--card)}
select,button{font:inherit;font-size:16px;font-weight:500;color:var(--fg);background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;min-height:48px;line-height:1.2}
select{-webkit-appearance:none;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
button:active{background:var(--line)}
#sel{flex:1 1 auto;min-width:0}
#tgt{flex:0 0 auto;width:74px}
#btnDraw{flex:0 0 auto;background:var(--acc);color:#fff;border-color:transparent;font-weight:700;padding:11px 22px;font-size:17px;letter-spacing:2px}
html[data-theme="dark"] #btnDraw{color:#0f1720}
#btnDraw:active{filter:brightness(.9)}
#btnInstall{background:var(--acc)!important;color:#fff!important;border-color:transparent!important;font-weight:700}
.tiny{font-size:13px;color:var(--dim);padding:8px 10px}
#meta{font-size:12px;color:var(--dim);margin-top:7px;display:flex;gap:4px 0;flex-wrap:wrap;line-height:1.5}
#meta span+span::before{content:"·";margin:0 7px;opacity:.6}
#meta:empty{display:none}
#meta .pn{margin-left:auto;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
#meta .pn::before{content:none}
#prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--line);overflow:hidden}
#prog i{position:absolute;top:0;bottom:0;width:0;transition:width .25s ease-out}
#pgGood{left:0;background:var(--good)}
#pgBad{right:0;background:var(--bad)}

/* ---------- 词卡 ---------- */
main{margin:0;padding:6px 0 calc(70px + env(safe-area-inset-bottom))}
.r{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:center;
  margin:6px 6px;padding:10px 10px 10px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;
  transition:background .12s,border-color .12s}
.r::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background .12s}
.w{grid-area:1/1;min-width:0;font-size:calc(var(--fs)*1px);font-weight:650;letter-spacing:.2px;word-break:break-word;line-height:1.2}
.m{grid-area:2/1/3/3;visibility:hidden;font-size:calc(var(--fs)*0.55px);line-height:1.45;color:var(--mean);
  min-height:calc(var(--fs)*0.55px*1.45);margin-top:6px;padding-left:10px;border-left:3px solid transparent;pointer-events:none}
.extra-star{font-size:.48em;vertical-align:super;margin-left:.08em;color:var(--acc);line-height:0}
.r.on .m{visibility:visible;border-left-color:var(--acc)}
.r.on .w{color:var(--acc)}
.r.on{border-color:var(--accsoft)}
.mk{grid-area:1/2;justify-self:end;display:flex;flex-direction:row;gap:10px;align-items:center;align-self:center}
.mk button{width:calc(var(--fs)*1px);height:calc(var(--fs)*1px);min-width:44px;min-height:44px;padding:0;font-size:calc(var(--fs)*0.5px);line-height:1;border-radius:14px;border:3px solid transparent;font-weight:700;transition:transform .07s ease-out,background .1s,box-shadow .12s;touch-action:manipulation}
.mk button:active{transform:scale(.88)}
@keyframes pop{0%{transform:scale(1.12)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.mk button.hit{animation:pop .18s ease-out}
.mk button.no{color:var(--bad);border-color:var(--badsoft);background:var(--badsoft)}
.mk button.yes{color:var(--good);border-color:var(--goodsoft);background:var(--goodsoft)}
.mk button.on{color:#fff;border-color:transparent}
.mk button.no.on{background:var(--bad)}
.mk button.yes.on{background:var(--good)}
html[data-theme="dark"] .mk button.on{color:#12161c}
.r.bad::before{background:var(--bad)}
.r.bad .w{color:var(--bad)}
.r.good::before{background:var(--good)}
.r.good .w{color:var(--good)}
body.big .r{margin:5px 4px;padding:8px 8px 8px 12px}
body.big .m{margin-top:6px;line-height:1.35}
.empty{padding:56px 24px;text-align:center;color:var(--dim);font-size:15px;line-height:2}

/* ---------- 弹窗：底部面板 ---------- */
dialog{border:none;padding:0;background:var(--card);color:var(--fg);
  width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;box-shadow:0 -6px 30px rgba(0,0,0,.18)}
dialog[open]{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
dialog::backdrop{background:#0008}
.pad{padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.pad::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.pad h3{margin:2px 0 12px;font-size:16px}
.pad h4{margin:14px 0 8px;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:1px}
.pad .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pad button{flex:1;min-width:120px;padding:12px;font-size:15px;background:var(--bg)}
.pad button.pri{background:var(--accsoft);color:var(--acc);border-color:transparent;font-weight:600}
.note{font-size:12px;color:var(--dim);line-height:1.7}
#ruleBody{font-size:13.5px;color:var(--mean);line-height:1.8}
#ruleBody b{color:var(--fg)}

/* ---------- 管理页 ---------- */
#manage{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-bottom:40px}
.mbar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bar)}
.mbar b{flex:1;font-size:16px}
.mact{display:flex;gap:6px;padding:10px 12px;flex-wrap:wrap}
.mact button{flex:1;min-width:calc(50% - 6px);padding:12px;font-size:15px}
.vrow{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-size:15px;color:var(--dim)}
.vrow input{flex:0 0 110px;font-size:22px;font-weight:700;text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:inherit}
.mrow{display:flex;align-items:center;gap:8px;margin:6px 10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mi{flex:1;min-width:0}
.mt{font-size:15px;font-weight:600}
.ms{font-size:12px;color:var(--dim);margin-top:3px}
.mrow button{padding:10px 14px;font-size:15px}
.mrow .md{color:var(--bad);border-color:var(--badsoft)}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2228e6;color:#fff;
  padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:88vw;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="l1">
    <select id="sel" title="选择日期/批次"></select>
    <select id="tgt" title="本次抽词量">
      <option value="25">25</option><option value="50">50</option>
      <option value="75" selected>75</option><option value="100">100</option>
      <option value="150">150</option>
    </select>
    <button id="btnDraw">抽词</button>
  </div>
  <div class="l2">
    <button id="btnInstall" hidden>安装</button>
    <button id="btnFsMinus" title="字号变小">A−</button>
    <button id="btnFsPlus" title="字号变大">A+</button>
    <button id="btnAll" title="全部显示/隐藏">全显</button>
    <button id="btnRule" title="本次抽词规则">规则</button>
    <button id="btnMore" title="更多">⋯</button>
  </div>
  <div id="meta"></div>
  <div id="prog"><i id="pgGood"></i><i id="pgBad"></i></div>
</header>
<main id="list"></main>
<div id="manage" hidden>
  <div class="mbar"><b>抽词记录</b><button id="mngClose">关闭</button></div>
  <div class="mact">
    <button id="mngExport">导出全部</button>
    <button id="mngBackup">备份</button>
    <button id="mngRestore">恢复</button>
    <button id="mngClear">清空缓存</button>
  </div>
  <div id="mngInfo" class="note" style="padding:10px 12px"></div>
  <div id="mngList"></div>
</div>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="pad">
    <h3>更多</h3>
    <div class="row">
      <button id="btnUpd" class="pri" title="重新拉取词表">更新词表</button>
      <button id="btnBad" class="pri" title="复制本组错词">复制错词</button>
      <button id="btnTheme" class="pri" title="深浅色">◐ 深浅色</button>
    </div>
    <h4>导出与复制</h4>
    <div class="row">
      <button id="btnExportCur">导出本组</button>
      <button id="btnExportAll">导出全部</button>
    </div>
    <div class="row">
      <button id="btnCopyAll">复制本组全部</button>
      <button id="btnCopyToday">复制今天错词</button>
    </div>
    <h4>备份与设置</h4>
    <div class="row">
      <button id="btnBackup">备份</button>
      <button id="btnRestore">恢复</button>
      <button id="btnClear">清空缓存</button>
      <button id="btnVib">振动测试</button>
    </div>
    <div class="vrow"><span>振动时长</span><input type="number" id="vibMs" min="0" max="200" step="5" inputmode="numeric" value="15"><span>毫秒（0 = 关闭）</span></div>
    <div class="note" id="info"></div>
    <div class="row" style="margin-top:14px">
      <button id="btnClose" style="flex:1">关闭</button>
    </div>
  </div>
</dialog>
<dialog id="dlgRule">
  <div class="pad">
    <h3>本次抽词规则</h3>
    <div class="note" id="ruleBody"></div>
    <div class="row" style="margin-top:14px">
      <button id="btnRuleClose" style="flex:1">关闭</button>
    </div>
  </div>
</dialog>
<input type="file" id="fileIn" accept=".json" hidden>

<script>
"use strict";
const APP_VER = "2.9";
const APP_BUILT = "2026-11-21";
const DATA_URL = "words.json";
const RELATED_URL = "related.json", K_RELATED = "ci.related";
const K_DATA = "ci.data", K_SETS = "ci.sets", K_PREFS = "ci.prefs", K_SEQ = "ci.seq", K_REV = "ci.rev";
const $ = id => document.getElementById(id);

/* ---------- 存储 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("存储失败：" + e.message); } },
  del(k) { localStorage.removeItem(k); }
};

let DATA = (store.get(K_DATA, null) || {}).payload || null;
let SETS = store.get(K_SETS, {});      // "2026-11-04|1" -> {date,n,target,words:[...]}
let PREFS = Object.assign({ vib: 15 }, store.get(K_PREFS, { fs: 26, theme: "light" }));
function buzz(ms) { try { const v = (ms === undefined ? (+PREFS.vib || 0) : ms); if (v > 0 && navigator.vibrate) navigator.vibrate(v); } catch (e) {} }
let RELATED = store.get(K_RELATED, null);
let WORD_INDEX = new Map(), MAIN_WORDS = new Set();
let curKey = null;                      // 当前查看的组
let REV = store.get(K_REV, {});          // 每个词的复习状态 {g:间隔天数, d:下次到期, s:连对, l:记错, n:复习次数}

/* 关联资料与历史快照只补充查词，不合并到母本 DATA.words。 */
function refreshWordIndex() {
  WORD_INDEX = new Map(); MAIN_WORDS = new Set();
  ((RELATED && RELATED.words) || []).forEach(o => {
    if (!o.anchorOnly || ((DATA && DATA.words) || []).some(x => x.w === o.w)) WORD_INDEX.set(o.w, o);
  });
  Object.keys(SETS).forEach(k => {
    const extra = SETS[k].extra || {};
    Object.keys(extra).forEach(w => { if (!WORD_INDEX.has(w)) WORD_INDEX.set(w, extra[w]); });
  });
  ((DATA && DATA.words) || []).forEach(o => { WORD_INDEX.set(o.w, o); MAIN_WORDS.add(o.w); });
}
function wordIndex() { return WORD_INDEX; }
function allReviewWords() { return Array.from(WORD_INDEX.values()); }
function wordInSet(w, s) { return (s && s.extra && s.extra[w] && !MAIN_WORDS.has(w)) ? s.extra[w] : WORD_INDEX.get(w); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function loadRelated() {
  try {
    const r = await fetch(RELATED_URL, { cache: "no-cache" });
    if (!r.ok) return false;
    const data = await r.json();
    if (!Array.isArray(data.words) || !Array.isArray(data.groups)) return false;
    RELATED = data; store.set(K_RELATED, RELATED); return true;
  } catch (e) { return false; }
}
refreshWordIndex();

/* ---------- 小工具 ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1600);
}
const pad2 = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const cn = s => { const a = s.split("-"); return (+a[1]) + "月" + (+a[2]) + "日"; };
const dayShift = (s, k) => { const a = s.split("-").map(Number); const d = new Date(a[0], a[1] - 1, a[2]); d.setDate(d.getDate() + k);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function lcg(seed) { let s = seed >>> 0; return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- 数据 ---------- */
async function loadData(force) {
  let ok = false;
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) {
      DATA = await r.json();
      store.set(K_DATA, { ts: Date.now(), payload: DATA });
      ok = true;
    }
  } catch (e) { /* 离线就用缓存 */ }
  if (!ok && DATA) toast("离线：用手机缓存里的词表");
  if (!ok && !DATA) { $("list").innerHTML = '<div class="empty">词表没加载到<br>连一次网再点「更新」</div>'; }
  await loadRelated();
  refreshWordIndex();
  render();
  return ok;
}

function renderMeta() {
  const m = $("meta");
  if (!DATA) { m.innerHTML = ""; return; }
  const n = DATA.count || DATA.words.length;
  const upd = DATA.updated ? cn(DATA.updated) : "—";
  const lb = (DATA.latest && DATA.latest.date) ? "错词批次 " + cn(DATA.latest.date) : "";
  const set = curKey && SETS[curKey] ? SETS[curKey] : null;
  let s = `<span>v${APP_VER}</span><span>词表 ${n} 词</span><span>到期 ${dueCount(todayStr())}</span><span>${lb}</span>`;
  if (set) {
    const on = document.querySelectorAll(".r.on").length;
    const bad = document.querySelectorAll(".r.bad").length;
    const good = document.querySelectorAll(".r.good").length;
    s += `<span>点开 ${on} · 错 ${bad} · 对 ${good}</span><span class="pn">${bad + good}/${set.words.length}</span>`;
  }
  m.innerHTML = s;
  const tot = set ? set.words.length : 0;
  const pct = x => tot ? (x / tot * 100) + "%" : "0";
  $("pgGood").style.width = set ? pct(document.querySelectorAll(".r.good").length) : "0";
  $("pgBad").style.width = set ? pct(document.querySelectorAll(".r.bad").length) : "0";
}

/* ---------- 抽词算法 ---------- */
function cmpFreq(a, b) { // 考频降序，待补(-1)最后，同分按词名
  const fa = a.f < 0 ? -1 : a.f, fb = b.f < 0 ? -1 : b.f;
  if (fa !== fb) return fb - fa;
  return a.w < b.w ? -1 : a.w > b.w ? 1 : 0;
}
function cmpCnt(a, b) {
  if (a.c !== b.c) return b.c - a.c;
  return a.w < b.w ? -1 : a.w > b.w ? 1 : 0;
}

/* 间隔复习：REV[词] = {g 间隔天数, d 下次到期日期, s 连续记对次数, l 记错次数, n 复习次数} */
function addD(day, n) {
  const a = day.split("-").map(Number);
  const d = new Date(a[0], a[1] - 1, a[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function gap0(c) { return c >= 6 ? 2 : c === 5 ? 3 : c === 4 ? 5 : c === 3 ? 7 : c === 2 ? 10 : 14; }
function dayDiff(a, b) { return Math.round((Date.parse(a + "T00:00:00") - Date.parse(b + "T00:00:00")) / 86400000); }
let RECENT = new Map();      // 近 30 天该词又被上传／抽到的次数
function buildRecent(day) {
  RECENT = new Map();
  const from = addD(day, -30);
  const B = (DATA && DATA.batches) || {};
  Object.keys(B).forEach(d => {
    if (d >= from && d <= day) (B[d] || []).forEach(w => RECENT.set(w, (RECENT.get(w) || 0) + 1));
  });
}
/* 老账放宽、近期反复错的收紧 */
function gap0eff(o) {
  let g = gap0(o.c);
  const r = RECENT.get(o.w) || 0;
  if (r === 0) g = Math.min(14, g * 2);      // 近 30 天没再错，当它旧账，先拉开
  else if (r >= 2) g = Math.max(2, g - 1);   // 近 30 天还在错，收紧
  return g;
}
function isGrad(w) { const r = REV[w]; return !!r && (r.g || 0) >= 90; }
function isFuture(w, day) { const r = REV[w]; return !!r && r.d > day; }   // 已排好下次日期，还没到期
function dueCount(day) { return DATA ? allReviewWords().filter(w => REV[w.w] && REV[w.w].d <= day && !isGrad(w.w)).length : 0; }
function gradCount() { return DATA ? allReviewWords().filter(w => isGrad(w.w)).length : 0; }

/* 抽到时：默认按「模糊」处理，间隔不放大 */
function scheduleAfterDraw(w, day) {
  const o = WORD_INDEX.get(w); if (!o) return;
  const r = REV[w] || { g: 0, s: 0, l: 0, n: 0 };
  if (!r.g) r.g = gap0eff(o);
  r.d = addD(day, Math.max(2, Math.round(r.g / 2)));
  r.n = (r.n || 0) + 1;
  REV[w] = r;
}
/* 标记：✓ 间隔放大；✗ 打回 2 天；再点取消 = 回到模糊 */
function applyMark(w, kind, day) {
  const o = WORD_INDEX.get(w); if (!o) return;
  const r = REV[w] || { g: gap0eff(o), s: 0, l: 0, n: 1 };
  if (kind === 1) {
    r.s = (r.s || 0) + 1;
    r.g = Math.min(90, Math.round((r.g || gap0eff(o)) * 1.9));
    if (r.s >= 3 && o.c >= 5) r.g = 90;          // 错了五六遍还连对三次 → 熟知，90 天后再见
    r.d = addD(day, r.g);
  } else if (kind === -1) {
    r.s = 0; r.l = (r.l || 0) + 1; r.g = 2; r.d = addD(day, 2);
  } else {
    r.s = 0; r.g = r.g || gap0eff(o); r.d = addD(day, Math.max(2, Math.round(r.g / 2)));
  }
  REV[w] = r;
}

function buildPick(target, seedStr, dateStr, drawnToday) {
  const byW = wordIndex();
  const used = new Set(), out = [], tags = {};
  let relatedCount = 0;
  const relatedPerGroup = new Map();
  const drawn = new Set(drawnToday || []);
  let skip = true;
  const push = (w, tag) => {
    if (out.length >= target || used.has(w.w)) return false;
    if (skip && drawn.has(w.w)) return false;
    used.add(w.w); out.push(w.w); tags[w.w] = tag; return true;
  };
  const rnd = lcg(hash(seedStr));
  const take = (list, n, start, tag) => { let a = 0; const L = list.length; if (!L) return 0;
    for (let i = 0; i < L && a < n && out.length < target; i++) { if (push(list[(start + i) % L], tag)) a++; } return a; };
  const T = target;

  const pass1 = () => {
    // A 今日新错词：全量，考频降序
    const A = ((DATA.latest && DATA.latest.words) || []).map(w => byW.get(w)).filter(Boolean).sort(cmpFreq);
    A.forEach(w => push(w, "今"));

    // B 到期复习：到期日已到（含逾期），错得越多越靠前
    if (out.length < T) {
      const due = allReviewWords().filter(w => REV[w.w] && REV[w.w].d <= dateStr && !isGrad(w.w))
        .sort((a, b) => (dayDiff(dateStr, REV[b.w].d) - dayDiff(dateStr, REV[a.w].d)) || (b.c - a.c) || cmpFreq(a, b));
      take(due, Math.round(T * 0.32), 0, "到期");
    }

    // C 词根/词缀/形近连坐：只扩展与母本词有联系的组，保留10词总配额。
    if (out.length < T && relatedCount < 10) {
      const latest = new Set(A.map(w => w.w));
      const seeds = new Set(out.filter(w => MAIN_WORDS.has(w)));
      const groups = ((RELATED && RELATED.groups) || []).filter(g =>
        g.words.some(w => MAIN_WORDS.has(w)) && g.words.every(w => byW.has(w)));
      const ranked = groups.map(g => ({g, rank: g.words.some(w => latest.has(w)) ? 0 : g.words.some(w => seeds.has(w)) ? 1 : 2, tie: rnd()}))
        .sort((a, b) => a.rank - b.rank || a.tie - b.tie);
      ranked.forEach(entry => {
        if (relatedCount >= 10 || out.length >= T) return;
        const g = entry.g, key = "new:" + g.id;
        let added = relatedPerGroup.get(key) || 0;
        const mem = g.words.map(w => byW.get(w)).filter(o => !isGrad(o.w) && !isFuture(o.w, dateStr) && !used.has(o.w));
        // 同等条件先给词表外成员；同类候选按当天种子轮转。
        const choices = mem.map(o => ({o, ext: MAIN_WORDS.has(o.w) ? 1 : 0, tie: rnd()}))
          .sort((a, b) => a.ext - b.ext || a.tie - b.tie);
        choices.forEach(x => {
          if (added < 2 && relatedCount < 10 && push(x.o, "形近")) { added++; relatedCount++; }
        });
        relatedPerGroup.set(key, added);
      });
      // 原有手工词族继续补足，避免移除用户原来的分组。
      const prio = [...new Set(A.map(w => w.fam).filter(Boolean))];
      const all = [...new Set(DATA.words.filter(w => w.fam).map(w => w.fam))].sort();
      const order = prio.concat(all.filter(f => prio.indexOf(f) < 0));
      const famMap = new Map();
      DATA.words.forEach(w => { if (!w.fam) return; if (!famMap.has(w.fam)) famMap.set(w.fam, []); famMap.get(w.fam).push(w); });
      for (const f of order) {
        if (relatedCount >= 10 || out.length >= T) break;
        const mem = (famMap.get(f) || []).filter(x => !isGrad(x.w) && !isFuture(x.w, dateStr)).slice().sort(cmpCnt);
        if (!mem.length) continue;
        const st = Math.floor(rnd() * mem.length), key = "old:" + f;
        let added = relatedPerGroup.get(key) || 0;
        for (let i = 0; i < mem.length && added < 2 && relatedCount < 10; i++) {
          if (push(mem[(st + i) % mem.length], "形近")) { added++; relatedCount++; }
        }
        relatedPerGroup.set(key, added);
      }
    }

    // D 黑洞补漏：错≥3 考频≤2，4 个
    if (out.length < T) {
      const E = DATA.words.filter(w => w.c >= 3 && w.f >= 0 && w.f <= 2 && !isGrad(w.w) && !isFuture(w.w, dateStr)).sort(cmpCnt);
      take(E, 4, Math.floor(rnd() * E.length), "黑洞");
    }

    // E 高频核心：考频≥20，8 个
    if (out.length < T) {
      const C = DATA.words.filter(w => w.f >= 20 && !isGrad(w.w) && !isFuture(w.w, dateStr)).sort(cmpFreq);
      take(C, 8, Math.floor(rnd() * C.length), "高频");
    }

    // F 补位：按考频补足
    if (out.length < T) {
      const rest = DATA.words.filter(w => !isGrad(w.w) && !isFuture(w.w, dateStr)).sort(cmpFreq);
      take(rest, T - out.length, Math.floor(rnd() * Math.max(1, rest.length)), "补位");
    }
  };

  pass1();
  if (out.length < target) { skip = false; pass1(); }
  return { words: out, tags };
}

function draw() {
  if (!DATA) { toast("词表还没加载"); return; }
  const target = +$("tgt").value;
  const day = todayStr();
  const seq = store.get(K_SEQ, {});
  const n = (seq[day] || 0) + 1;
  const prev = Object.keys(SETS).filter(k => k.indexOf(day + "|") === 0).length;
  const nn = Math.max(n, prev + 1);
  const key = day + "|" + nn;
  const drawnToday = [];
  Object.values(SETS).forEach(s => { if (s.date === day) s.words.forEach(w => drawnToday.push(w)); });
  buildRecent(day);
  const res = buildPick(target, key + "#" + target, day, drawnToday);
  res.words.forEach(w => scheduleAfterDraw(w, day));
  store.set(K_REV, REV);
  const extra = {};
  res.words.forEach(w => { if (!MAIN_WORDS.has(w) && WORD_INDEX.has(w)) extra[w] = Object.assign({}, WORD_INDEX.get(w)); });
  SETS[key] = { date: day, n: nn, target, words: res.words, tags: res.tags, extra, ts: Date.now() };
  seq[day] = nn; store.set(K_SEQ, seq); store.set(K_SETS, SETS);
  curKey = key;
  fillSel();
  render();
  toast("抽出 " + res.words.length + " 词 · " + cn(day) + " 第" + nn + "次");
}

function recoverTags(s, key) {
  try {
    const res = buildPick(s.target, key + "#" + s.target, s.date, []);
    if (res.words.length === s.words.length && res.words.every((w, i) => w === s.words[i])) {
      s.tags = res.tags; store.set(K_SETS, SETS); return true;
    }
  } catch (e) { }
  return false;
}

/* ---------- 渲染 ---------- */
function render() {
  const box = $("list");
  const set = curKey && SETS[curKey];
  if (!set) { box.innerHTML = '<div class="empty">选个日期，或者点「抽词」<br>抽出来的词会自动存在手机上</div>'; renderMeta(); return; }
  const byW = wordIndex();
  const marks = set.marks || {};
  const html = set.words.map(w => {
    const o = wordInSet(w, set);
    const external = !!o && !MAIN_WORDS.has(w);
    const mean = o ? ((o.p || "") + (o.d || "")) : "（词表里没有这个词）";
    const m = marks[w] || 0;
    const cls = "r" + (m === -1 ? " bad" : m === 1 ? " good" : "");
    return '<div class="' + cls + '" data-w="' + w + '">' +
      '<div class="w">' + escapeHtml(w) + (external ? '<sup class="extra-star" title="大纲资料补充词，未收入个人词表" aria-label="词表外补充词">*</sup>' : '') + '</div><div class="m">' + escapeHtml(mean) + '</div>' +
      '<div class="mk"><button class="no' + (m === -1 ? " on" : "") + '" data-k="-1">✗</button>' +
      '<button class="yes' + (m === 1 ? " on" : "") + '" data-k="1">✓</button></div></div>';
  }).join("");
  box.innerHTML = html || '<div class="empty">这组是空的</div>';
  box.querySelectorAll(".r").forEach(el => {
    el.addEventListener("click", () => { el.classList.toggle("on"); renderMeta(); });
    el.querySelectorAll(".mk button").forEach(b => {
      b.addEventListener("click", ev => {
        ev.stopPropagation();
        buzz();
        const w = el.dataset.w, k = +b.dataset.k;
        const st = curSet();
        st.marks = st.marks || {};
        const now = st.marks[w] === k ? 0 : k;
        if (now === 0) delete st.marks[w]; else st.marks[w] = now;
        store.set(K_SETS, SETS);
        applyMark(w, now, todayStr());
        store.set(K_REV, REV);
        el.classList.remove("bad", "good");
        el.querySelectorAll(".mk button").forEach(x => x.classList.remove("on"));
        if (now === -1) { el.classList.add("bad"); el.querySelector(".mk .no").classList.add("on"); }
        if (now === 1) { el.classList.add("good", "on"); el.querySelector(".mk .yes").classList.add("on"); }
        b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit");
        renderMeta();
      });
    });
  });
  window.scrollTo({ top: 0 });
  renderMeta();
}

let lastSel = null;
function sortedKeys() {
  return Object.keys(SETS).sort((a, b) => {
    const A = SETS[a], B = SETS[b];
    if (A.date !== B.date) return A.date < B.date ? 1 : -1;
    return B.n - A.n;
  });
}
function fillSel() {
  const sel = $("sel"), keep = curKey;
  const keys = sortedKeys();
  if (!keys.length) { sel.innerHTML = '<option value="">（还没抽过）</option>'; curKey = null; lastSel = null; return; }
  const top = keys.slice(0, 10);
  sel.innerHTML = top.map(k => {
    const s = SETS[k];
    return '<option value="' + k + '">' + cn(s.date) + ' 第' + s.n + '次 · ' + s.words.length + '词</option>';
  }).join("") + (keys.length > 10 ? '<option value="__more">查看更多（共' + keys.length + '组）…</option>' : "");
  if (keep && SETS[keep]) sel.value = keep; else curKey = sel.value = keys[0];
  lastSel = curKey;
}

function openManage() { $("manage").hidden = false; renderManage(); }

  });
}

function download(name, text, type) {

}

  if (ms <= 0) { toast("当前是 0 毫秒，先在上面填个数字再试"); return; }
  const ok = navigator.vibrate(ms);
  toast("已请求 " + ms + "ms，返回 " + ok + (ok ? "" : "（被系统拦了）") + "；若手机仍静音，把铃声调到“振动”档再试");
});
(() => {
  const inp = $("vibMs");
  inp.value = PREFS.vib;
  inp.addEventListener("change", () => {
    let v = parseInt(inp.value, 10);
    if (isNaN(v)) v = 15;
    v = Math.max(0, Math.min(200, v));
    PREFS.vib = v; inp.value = v; store.set(K_PREFS, PREFS);
    buzz(v); toast("振动时长 " + v + "ms" + (v ? "" : "（已关闭）"));
  });
})();

$("btnMore").addEventListener("click", () => {
  const s = curSet();
  const size = (JSON.stringify(SETS).length / 1024).toFixed(1);
  $("info").innerHTML =
    "网站版本 v" + APP_VER + "（" + cn(APP_BUILT) + " 构建）<br>" +
    "词表 " + (DATA ? DATA.words.length : 0) + " 词，更新于 " + (DATA && DATA.updated ? cn(DATA.updated) : "—") + "<br>" +
    "已存 " + Object.keys(SETS).length + " 组抽词（" + size + " KB）<br>" +
    "当前：" + (s ? cn(s.date) + " 第" + s.n + "次 · " + s.words.length + "词 · 目标" + s.target : "无") + "<br>" +
    "<br>备份会把所有抽过的组一起导出成 json；换手机时用「恢复」导入。";
  $("dlg").showModal();
});
$("btnClose").addEventListener("click", () => $("dlg").close());
$("btnExportCur").addEventListener("click", () => {
  const s = curSet(); if (!s) { toast("没有可导出的组"); return; }
  download(cn(s.date) + "抽词-第" + s.n + "次.txt", setToText(s));
  toast("已导出本组");
});
function doExportAll() {
  const keys = Object.keys(SETS).sort(); if (!keys.length) { toast("还没抽过词"); return; }
  download("抽词全部-" + todayStr() + ".txt", keys.map(k => {
    const s = SETS[k]; return "=== " + cn(s.date) + " 第" + s.n + "次（" + s.words.length + "词） ===\n" + setToText(s);
  }).join("\n\n"));
  toast("已导出全部");
}
$("btnExportAll").addEventListener("click", doExportAll);
$("mngExport").addEventListener("click", doExportAll);
$("btnCopyAll").addEventListener("click", () => {
  const s = curSet(); if (!s) { toast("没有可复制的组"); return; }
  copyText(s.words.join("\n"));
});
$("btnCopyToday").addEventListener("click", () => {
  const day = todayStr(), out = [];
  Object.values(SETS).forEach(s => { if (s.date === day) badWords(s).forEach(w => { if (out.indexOf(w) < 0) out.push(w); }); });
  if (!out.length) { toast("今天还没有标错的词"); return; }
  copyText(out.join("\n"));
});
function doBackup() {
  download("抽词备份-" + todayStr() + ".json", JSON.stringify({ v: 3, ts: Date.now(), prefs: PREFS, sets: SETS, rev: REV }, null, 1), "application/json");
  toast("已备份");
}
$("btnBackup").addEventListener("click", doBackup);
$("mngBackup").addEventListener("click", doBackup);
$("btnRestore").addEventListener("click", () => $("fileIn").click());
$("mngRestore").addEventListener("click", () => $("fileIn").click());
$("fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o.sets) throw new Error("不是备份文件");
      let n = 0;
      Object.keys(o.sets).forEach(k => { if (!SETS[k]) { SETS[k] = o.sets[k]; n++; } });
      store.set(K_SETS, SETS);
      if (o.rev) { Object.keys(o.rev).forEach(k => { if (!REV[k]) REV[k] = o.rev[k]; }); store.set(K_REV, REV); }
      if (o.prefs) { PREFS = Object.assign(PREFS, o.prefs); applyPrefs(); store.set(K_PREFS, PREFS); }
      refreshWordIndex(); fillSel(); render(); toast("恢复 " + n + " 组");
    } catch (err) { toast("恢复失败：" + err.message); }
    e.target.value = "";
  };
  rd.readAsText(f);
});
function doClear() {
  if (!confirm("清空手机上所有抽词记录和复习进度？词表缓存会保留。")) return;
  SETS = {}; REV = {}; store.set(K_SETS, {}); store.set(K_REV, {}); store.del(K_SEQ); curKey = null; refreshWordIndex(); fillSel(); render();
  if (!$("manage").hidden) renderManage();
  toast("已清空");
}
$("btnClear").addEventListener("click", doClear);
$("mngClear").addEventListener("click", doClear);

/* ---------- 启动 ---------- */
function applyPrefs() {
  document.documentElement.style.setProperty("--fs", PREFS.fs);
  document.documentElement.setAttribute("data-theme", PREFS.theme || "light");
  document.body.classList.toggle("big", PREFS.fs >= 60);
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute("content", PREFS.theme === "dark" ? "#12161c" : "#f3f1ec");
}
["btnUpd", "btnBad", "btnRule"].forEach(id => $(id).addEventListener("click", () => { if ($("dlg").open) $("dlg").close(); }, true));
(async function init() {
  applyPrefs();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => { }); });
  }
  fillSel();
  render();
  await loadData(false);
  fillSel();
  render();
})();
</script>
</body>
</html>
